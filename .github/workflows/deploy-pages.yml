name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 되지만, 진행 중인 것을 죽이지도 않는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm test

      # 사용자 페이지(<owner>.github.io)가 아니면 /<레포명> 하위에 배포된다.
      # 레포 이름이 바뀌어도 따라가도록 여기서 계산한다.
      - name: 배포 경로 계산
        id: paths
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER_LOWER.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi
          echo "site=https://$OWNER_LOWER.github.io" >> "$GITHUB_OUTPUT"

      - name: 정적 빌드
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site }}
        run: npm run build

      # Pages 는 Jekyll 을 돌리지 않지만, _next 처럼 밑줄로 시작하는 폴더를
      # 흘려보내지 않도록 보험을 둔다.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
